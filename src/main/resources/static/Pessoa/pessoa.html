<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<title>Genealogia Profissional</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 20px;
		}

		ul {
			list-style: none;
			padding-left: 20px;
		}

		li {
			margin: 4px 0;
			position: relative;
		}

		#arvore {
			margin-top: 20px;
		}

		.action-btn {
			cursor: pointer;
			margin-left: 5px;
			font-weight: bold;
		}

		.action-btn:hover {
			color: #4CAF50;
		}

		/* PAINEL FLUTUANTE */
		#painel {
			position: absolute;
			background: #fff;
			border: 1px solid #ccc;
			padding: 8px;
			border-radius: 6px;
			display: none;
			z-index: 1000;
			cursor: move;
			white-space: nowrap;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
		}

		#painel button {
			display: inline-block;
			margin: 2px;
		}

		/* MODAIS */
		.modal {
			display: none;
			position: fixed;
			top: 10%;
			left: 50%;
			transform: translateX(-50%);
			background: #fff;
			padding: 20px;
			border: 1px solid #ccc;
			z-index: 3000;
			width: 320px;
			max-height: 400px;
			overflow: auto;
		}

		.overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.3);
			z-index: 2000;
		}

		/* JUDIA - destaque surreal com leque */
		#judiaFigura {
			position: fixed;
			top: 10px;
			right: 10px;
			font-size: 1.8rem;
			color: #FF0000;
			text-shadow: 0 0 10px #FF0000, 0 0 20px #FF4500, 0 0 30px #FFA500;
			z-index: 5000;
			animation: abanar 2s infinite alternate;
		}

		.btn-remover {
			background-color: #ff4d4d;
			color: white;
			border: none;
			padding: 6px 12px;
			border-radius: 4px;
			cursor: pointer;
			margin-bottom: 15px;
			display: block;
			/* Garante que ele quebre a linha sozinho */
		}

		.btn-remover:hover {
			background-color: #e60000;
			/* Escurece um pouco ao passar o mouse */
		}




		@keyframes abanar {
			0% {
				transform: rotate(0deg);
			}

			50% {
				transform: rotate(5deg);
			}

			100% {
				transform: rotate(-5deg);
			}
		}
		
		/* Coloque isso dentro da sua tag <style> atual */
		#alterarFoto.com-foto-banco::-webkit-file-upload-button + span,
		#alterarFoto.com-foto-banco {
		    color: #000 !important;
		    font-weight: bold;
		}

		/* Força o navegador a exibir o nome do arquivo que veio do banco no lugar do texto padrão */
		#alterarFoto.com-foto-banco::after {
		    content: var(--texto-exibicao);
		    margin-left: 10px;
		    font-weight: bold;
		    color: #333;
		}
		
		
		
	</style>
</head>
